org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/tmp/gradle
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.enableJetifier=true
# Disable Kotlin incremental compilation to prevent cross-drive cache corruption
# (pub cache on C:\ vs project on D:\ causes RelocatableFileToPathConverter crash)
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.daemon.jvm.options=-Xmx2G -Djava.io.tmpdir=D:/tmp/kotlin
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Fix: Disable testOnly flag that causes ADB streamed install to fail on vivo/OEM devices
# Flutter debug builds are sometimes flagged as testOnly which blocks normal ADB install
android.injected.testOnly=false

# Fix: Disable incremental/streamed install — falls back to standard install on vivo V29
# Streamed install via ADB fails on this device's USB stack (causes ADB exit code 1)
android.experimental.enableNewResourceShrinker=false
